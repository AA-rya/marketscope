name: update-data
on:
  schedule:
    - cron: "3,33 * * * *"
  workflow_dispatch:
  push:
    paths:
      - fetch_data.py
      - .github/workflows/update-data.yml
permissions:
  contents: write
concurrency:
  group: update-data
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance pandas
      - name: Collect every 5 minutes for about 50 minutes (GitHub's own cron is too unreliable to call every 5 min)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          START=$(date +%s)
          while true; do
            python fetch_data.py || true
            git add data.json fundamentals.json
            git diff --cached --quiet || (git commit -q -m "Update market data" && git pull --rebase -q origin main && git push -q origin HEAD:main) || true
            [ $(( $(date +%s) - START )) -gt 2700 ] && break
            sleep 240
          done

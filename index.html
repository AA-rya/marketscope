<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketscope — FMKT 256</title>
<style>
:root{--bg:#f6ece4;--panel:#fffaf7;--ink:#3a2a2c;--mute:#8a7273;--line:#ecdcd3;--acc:#c4607a;--acc2:#a07a5c;--up:#4f8a6a;--dn:#c0455a;--shadow:0 1px 2px rgba(120,70,70,.05),0 8px 24px rgba(160,100,100,.09);--font:"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:14px;padding:16px 32px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:var(--panel)}
.logo svg{width:20px;height:20px}
h1{font:700 20px var(--font);margin:0;letter-spacing:-.3px}h1 small{display:block;font:500 11px var(--sans);color:var(--mute);letter-spacing:.3px;margin-top:1px}
.spacer{flex:1}select,input,button,textarea{font:inherit;color:var(--ink)}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);padding:8px 11px;border-radius:10px;outline:none;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 15%,transparent)}
button{background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;transition:all .15s}button:hover{border-color:var(--acc);transform:translateY(-1px)}
button.pri{background:var(--acc);color:var(--panel);border-color:var(--acc)}
nav{display:flex;gap:6px;padding:16px 32px 0;align-items:center}
nav .tab{padding:9px 18px;border-radius:999px;cursor:grab;font-weight:600;font-size:14px;color:var(--mute);user-select:none;transition:all .15s;background:transparent}
nav .tab:hover{color:var(--ink)}nav .tab.on{background:var(--acc);color:var(--panel)}nav .tab.over{outline:2px dashed var(--acc2)}
main{padding:30px 36px 70px;max-width:1200px;margin:0 auto}
.row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}.col{flex:1;min-width:300px}
.card{background:var(--panel);border:1px solid var(--line);padding:20px 22px;border-radius:16px;margin-bottom:20px;box-shadow:var(--shadow)}
.card h2{font:700 17px var(--font);margin:0 0 4px;letter-spacing:-.2px}.note{color:var(--mute);font-size:13px}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 4px;letter-spacing:.2px}
input[type=range]{accent-color:var(--acc2)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.7px;color:var(--mute);text-align:right;padding:10px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right}
td:first-child{font-weight:700}
tr.hit td{background:color-mix(in srgb,var(--acc2) 9%,transparent)}tr.hit td:first-child{box-shadow:inset 3px 0 var(--acc2)}.up{color:var(--up);font-weight:600}.dn{color:var(--dn);font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;border:1px solid var(--line);padding:3px 10px;border-radius:999px;color:var(--mute)}
.pill.live{color:var(--up);border-color:color-mix(in srgb,var(--up) 40%,transparent);background:color-mix(in srgb,var(--up) 8%,transparent)}.pill.warn{color:var(--dn);border-color:color-mix(in srgb,var(--dn) 40%,transparent);background:color-mix(in srgb,var(--dn) 7%,transparent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi b{display:block;font:700 26px var(--font);letter-spacing:-.6px;margin-top:2px}.kpi span{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}.kpi i{font-style:normal;font-size:13px;font-weight:600;color:var(--mute);display:block;margin-top:2px;letter-spacing:0}
.hero{background:var(--acc);color:var(--panel);border-radius:22px;padding:34px 36px;margin-bottom:22px;position:relative;overflow:hidden}
.hero h2{font:800 34px var(--font);letter-spacing:-1px;margin:0 0 8px;color:var(--panel)}.hero p{margin:0;max-width:560px;opacity:.85;font-size:16px}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:var(--acc2);opacity:.9}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-bottom:6px}
.grid3 .card{margin:0}.step{width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--acc2) 16%,transparent);color:var(--acc2);display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.go{color:var(--acc2);font-weight:600;text-decoration:none;cursor:pointer}
#toast{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:9}
#toast div{background:var(--ink);color:var(--panel);padding:12px 16px;border-radius:12px;max-width:340px;font-size:13px;box-shadow:var(--shadow)}
#help{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--panel);border-left:1px solid var(--line);padding:22px;transform:translateX(100%);transition:transform .25s;z-index:8;overflow:auto;box-shadow:var(--shadow)}
#help.open{transform:none}#helpOut{white-space:pre-wrap;margin-top:12px;font-size:14px}
.q{cursor:pointer;color:var(--acc2);font-weight:500;display:block;margin:6px 0;font-size:13px}
canvas,svg{max-width:100%}
.src{font-size:12px;color:var(--mute);margin-top:8px}

.app{display:flex;min-height:100vh}
#side{width:240px;flex:none;position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;gap:4px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 18px}
#side .tab{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mute);transition:all .15s}
#side .tab:hover{background:color-mix(in srgb,var(--acc) 7%,transparent);color:var(--ink)}
#side .tab.on{background:var(--acc);color:var(--panel)}
#side .tab svg{width:18px;height:18px;flex:none}
.sidesp{flex:1}.stat2{font-size:12px;line-height:1.5;padding:0 4px}.stat2 b{color:var(--ink);font-weight:600}
.sidebox{padding:10px 8px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);margin-top:8px}
.content{flex:1;min-width:0}
@media(max-width:820px){.app{flex-direction:column}#side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.brand{padding:0 8px 0 0}.sidesp{display:none}.sidebox{border:0;margin:0;flex-direction:row;padding:0}main{padding:16px}}

.pagehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:2px 0 18px}.pagehead h2{font:800 28px var(--font);letter-spacing:-.8px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}.tn{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.tp{font:700 24px var(--font);letter-spacing:-.5px;margin:2px 0}.tc{font-size:13px;font-weight:600}.tm{margin-top:4px;font-size:12px}.spark{width:100%;height:30px;display:block;margin-top:6px}
.chart{width:100%;height:auto;display:block}.ax{fill:var(--mute);font:11px var(--sans)}.nl{fill:var(--ink);font:700 13px var(--sans)}.nv{fill:var(--mute);font:12px var(--sans)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.hb{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;padding:6px 0;font-size:13px}.hl{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht{position:relative;height:18px;background:color-mix(in srgb,var(--line) 55%,transparent);border-radius:9px}.hz{position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--mute);opacity:.5}.hf{position:absolute;top:0;bottom:0;border-radius:9px;min-width:3px}.hv{text-align:right;font-weight:600}
.hax{display:grid;grid-template-columns:150px 1fr 64px;font-size:11px;color:var(--mute);margin-top:4px}.hax span:nth-child(1){grid-column:2;justify-self:start}.hax{display:flex;justify-content:space-between;padding:0 64px 0 160px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.big{font:800 44px var(--font);letter-spacing:-1.5px;margin:6px 0 2px}.big small{font:600 14px var(--sans);color:var(--mute);letter-spacing:0}.big.sm2{font-size:30px}
.rng{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0;background:transparent;padding:8px 14px}.seg button.on{background:var(--acc);color:#fff}.seg button:hover{transform:none}
.howto{padding:0}.howto summary{cursor:pointer;font:700 15px var(--font);padding:14px 22px;list-style:none}.howto summary::after{content:"+";float:right;color:var(--mute)}.howto[open] summary::after{content:"–"}.howto ol{margin:0;padding:0 22px 16px 42px;color:var(--ink)}.howto li{margin:6px 0}
.headline{background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:12px;padding:12px 16px;margin:10px 0 14px;font-size:14px}
.tw{overflow-x:auto}.tw table{font-size:13px}.tw td,.tw th{padding-left:7px;padding-right:7px}.pill.amber{color:#9a6a1c;border-color:#e3c48d;background:#fbf1de}.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:500;color:var(--ink)}.chk input{width:auto}.inl{display:inline;margin:0 4px 0 0}
.src-tbl td,.src-tbl th{text-align:left;font-size:13px;vertical-align:top}.pfr{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;margin:6px 0}.pfr label{margin:0}.pfo{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.kpi b.sm{font-size:19px;letter-spacing:-.3px;line-height:1.2}.kpi i{display:block}h3{font:700 14px var(--font);margin:6px 0 4px}
@media(max-width:560px){.hb{grid-template-columns:96px 1fr 56px}.hax{padding-left:106px}.big{font-size:36px}}

.star{cursor:pointer;color:var(--acc2);font-size:16px;width:24px;text-align:center!important}tr[data-t]{cursor:pointer}tr[data-t]:hover td{background:color-mix(in srgb,var(--acc) 6%,transparent)}
button.mini{padding:4px 10px;font-size:12px;border-radius:8px}
#modal{display:none;position:fixed;inset:0;z-index:20}#modal.open{display:block}.mback{position:absolute;inset:0;background:rgba(58,42,44,.4)}
.mbox{position:relative;max-width:700px;margin:6vh auto 0;max-height:88vh;overflow:auto;background:var(--panel);border-radius:20px;padding:22px 24px;box-shadow:var(--shadow)}
.mhead{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}.mt{font:800 28px var(--font);letter-spacing:-.6px}.mp{font:700 24px var(--font)}.mt2{margin-top:10px}.mt2 td,.mt2 th{padding:8px 10px}
#help{display:flex;flex-direction:column;padding:18px}.hh>div:last-child{white-space:nowrap}.hh{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px}
#helpOut{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;margin:0;white-space:normal;font-size:14px;padding:4px 2px}
.msg{max-width:92%;padding:10px 13px;border-radius:14px;line-height:1.5}.msg.bot{background:color-mix(in srgb,var(--acc2) 10%,var(--panel));border:1px solid var(--line);align-self:flex-start}.msg.me{background:var(--acc);color:#fff;align-self:flex-end}
.msg a{color:var(--acc);font-weight:600}.msg.me a{color:#fff}.act{display:inline-block;margin:4px 8px 0 0;padding:2px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;text-decoration:none}
#helpSugg{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}#helpSugg .q{display:inline-block;margin:0;padding:4px 10px;border:1px solid var(--line);border-radius:999px;font-size:12px;color:var(--ink);background:var(--bg)}
.hin{display:flex;gap:8px}.hin input{flex:1}
.mvr{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--line);font-size:14px}.nw{padding:9px 0;border-bottom:1px solid var(--line)}.nw a{color:var(--ink);font-weight:600;text-decoration:none}.nw a:hover{color:var(--acc)}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 8-10"/><path d="M15 5h5v5"/></svg></div><h1>Marketscope<small>FMKT 256</small></h1></div>
  <div id="tabs"></div>
  <div class="sidesp"></div>
  <div class="sidebox"><span id="status" class="pill">connecting to data…</span><div id="stat2" class="note stat2"></div><button id="helpBtn">Help / Ask</button></div>
  <div id="tabsBottom" style="margin-top:6px"></div>
</aside>
<div class="content"><main id="view"></main></div>
</div>
<div id="toast"></div>
<aside id="help">
  <div class="hh"><div><b style="font-family:var(--font);font-size:18px">Ask Marketscope</b><div class="note">Answers from the live data on this site</div></div><div><button id="helpClr" class="mini">Clear</button> <button id="helpX" class="mini">Close</button></div></div>
  <div id="helpOut"></div>
  <div id="helpSugg"></div>
  <div class="hin"><input id="helpQ" type="text" placeholder="Ask a question…" autocomplete="off"><button class="pri" id="helpGo">Send</button></div>
</aside>

<script>
/* ---------- state & helpers ---------- */
const $=s=>document.querySelector(s);
const fmt=(n,d=1)=>Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),6000)}
function parseCSV(t){const L=t.trim().split(/\r?\n/).map(l=>l.split(',').map(x=>x.trim()));const h=L.shift();return L.map(r=>Object.fromEntries(h.map((k,i)=>[k,isNaN(r[i])||r[i]===''?r[i]:+r[i]])))}
function toCSV(rows){const h=Object.keys(rows[0]);return [h.join(','),...rows.map(r=>h.map(k=>r[k]).join(','))].join('\n')}
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()}
function importBox(onData){const i=document.createElement('input');i.type='file';i.accept='.csv';i.onchange=()=>i.files[0].text().then(t=>{try{onData(parseCSV(t));toast('Imported '+i.files[0].name)}catch(e){toast('Could not parse CSV')}});i.click()}


/* ---------- live data ---------- */
let live=null, screenData=store.get('screen',null)||[], sectData=store.get('sect',null)||[], flowData=store.get('flow',null);
const isImp=k=>!!store.get(k,null);
const tag=k=>isImp(k)?'<span class="pill">your imported file</span>':(live?'<span class="pill live">live data</span>':'<span class="pill">loading…</span>');
let rates=store.get('rates',null);
async function pullRates(){
  const u='https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/avg_interest_rates?filter=security_desc:in:(Treasury%20Bills,Treasury%20Notes,Treasury%20Bonds)&sort=-record_date&page[size]=60';
  try{const r=await fetch(u);const j=await r.json();rates=j.data.map(d=>({date:d.record_date,security:d.security_desc,rate:+d.avg_interest_rate_amt}));store.set('rates',rates);return true}catch(e){return false}
}
function ago(iso){const s=(Date.now()-new Date(iso))/1000;if(s<90)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago'}
function setStatus(){const s=$('#status'),t=$('#stat2');if(!live){s.textContent='connecting…';s.className='pill';t.innerHTML='';return}
  const u=new Date(live.updated),mins=(Date.now()-u)/60000,old=mins>45,nx=new Date(+u+5*60000),tm=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  s.textContent=(old?'Delayed · ':'Live · ')+'updated '+ago(live.updated);s.className='pill '+(old?'warn':'live');
  const left=(nx-Date.now())/60000;
  t.innerHTML=`Last refresh: <b>${tm(u)}</b><br>Next refresh: <b>${left>0.5?'about '+tm(nx):(old?'delayed — waiting on the collector':'any moment now')}</b>${left>0.5?' (in '+Math.ceil(left)+' min)':''}<br>Refreshes every 5 min`}
async function loadLive(){
  try{const r=await fetch('data.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();if(!j.updated)throw 0;
    const first=!live;live=j;
    if(!isImp('screen')&&j.screen)screenData=j.screen;if(!isImp('sect')&&j.sect)sectData=j.sect;if(!isImp('flow'))flowData=j.flow||null;
    setStatus();redraw();checkAlerts();
  }catch(e){setStatus()}
}
function redraw(){
  if(cur==='markets'&&$('#mk'))drawMarkets();
  else if(cur==='screener'&&$('#tbl')){drawTbl(true);$('#srcpill').innerHTML=tag('screen')}
  else if(cur==='sim'&&$('#bars'))drawSim();
  else if(cur==='viz'&&$('#viz')){drawViz();drawOil()}
  else if(cur==='markets'||cur==='screener'||cur==='sim'||cur==='viz'){MODS[cur].r()}
}
const rate10=()=>{const a=live&&live.rates&&live.rates.DGS10;return a&&a.length?a[a.length-1][1]:null};
const empty=(what)=>`<div class="card"><h2>Waiting for live data</h2><p class="note">${what} will appear as soon as the data feed answers. If this message stays, refresh the page — or import your own CSV on this tab.</p></div>`;

/* ---------- small chart helpers ---------- */
function spark(a,up){const lo=Math.min(...a),hi=Math.max(...a),w=100,h=28,p=a.map((v,i)=>[i/(a.length-1)*w,h-2-(v-lo)/((hi-lo)||1)*(h-4)]);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="spark"><polyline points="${p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="var(${up?'--up':'--dn'})" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}
const pc=(v,d=2)=>`<span class="${v>=0?'up':'dn'}">${v>=0?'+':''}${fmt(v,d)}%</span>`;

/* ---------- tabs ---------- */
const MODS={watch:{t:'Watchlist',r:renderWatch},about:{t:'How it works',r:renderAbout},markets:{t:'Markets',r:renderMarkets},screener:{t:'Screener',r:renderScreener},sim:{t:'Rate Simulator',r:renderSim},viz:{t:'Oil Flow Map',r:renderViz}};
const order=['markets','screener','watch','sim','viz'];let cur=store.get('cur4','markets');if(!MODS[cur])cur='markets';
const ICO={watch:'<path d="M12 3l2.7 5.6 6.1.8-4.5 4.2 1.1 6-5.4-3-5.4 3 1.1-6L3.2 9.4l6.1-.8z"/>',markets:'<path d="M3 17l5-6 4 4 8-10"/><path d="M15 5h5v5"/>',screener:'<path d="M3 5h18M6 12h12M10 19h4"/>',sim:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',viz:'<path d="M3 6c6 0 6 12 12 12h6M3 18c6 0 6-12 12-12h6"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'};
function go(k){cur=k;store.set('cur4',k);drawTabs();MODS[k].r();scrollTo(0,0)}
function tabEl(k){const d=document.createElement('div');d.className='tab'+(k===cur?' on':'');d.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICO[k]+'</svg>'+MODS[k].t;d.onclick=()=>go(k);return d}
function drawTabs(){const n=$('#tabs'),m=$('#tabsBottom');n.innerHTML='';m.innerHTML='';order.forEach(k=>n.appendChild(tabEl(k)));m.appendChild(tabEl('about'))}

/* ---------- HOW IT WORKS ---------- */
function renderAbout(){
  const l=k=>`<a href="#" data-go="${k}" class="go">${MODS[k].t} &rarr;</a>`;
  $('#view').innerHTML=`<div>

function curveSvg(c){

  const X=i=>m.l+(W-m.l-m.r)*i/(L.length-1),Y=v=>m.t+(H-m.t-m.b)*(1-(v-lo)/(hi-lo));let s='';
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${m.l-8}" y="${y+4}" text-anchor="end" class="ax">${v.toFixed(2)}%</text>`}
  L.forEach((t,i)=>{s+=`<text x="${X(i)}" y="${H-8}" text-anchor="middle" class="ax">${t.replace(' Mo','M').replace(' Yr','Y')}</text>`});
  const line=(k,col,dash,w)=>{const p=c[k].v.map((v,i)=>v==null?null:X(i)+','+Y(v)).filter(Boolean);return `<polyline points="${p.join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" ${dash?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`};
  s+=line('y1','var(--line)',0,2.5).replace('stroke="var(--line)"','stroke="#d8c3b8"')+line('m1','var(--acc2)',1,2)+line('now','var(--acc)',0,3);
  return `<svg viewBox="0 0 ${W} ${H}" class="chart">${s}</svg>`}

  $('#nt').checked=window.Notification&&Notification.permission==='granted';$('#nt').onchange=e=>{if(e.target.checked&&window.Notification)Notification.requestPermission().then(p=>{if(p!=='granted')e.target.checked=false})};
  const add=()=>{const t=$('#wt').value.trim().toUpperCase();if(!screenData.find(x=>x.ticker===t)){toast('Ticker not found in the tracked list');return}if(!watch().includes(t))toggleWatch(t);renderWatch()};
  $('#wa').onclick=add;$('#wt').onkeydown=e=>{if(e.key==='Enter')add()};
  document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{toggleWatch(b.dataset.rm);renderWatch()});
  document.querySelectorAll('[data-o]').forEach(a=>a.onclick=e=>{e.preventDefault();openStock(a.dataset.o)});
  $('#aa').onclick=()=>{const t=$('#at').value.trim().toUpperCase(),p=+$('#ap').value;if(!screenData.find(x=>x.ticker===t)||!p){toast('Enter a valid ticker and price');return}const a=store.get('palerts',[]);a.push({t,dir:$('#ad').value,px:p,done:false});store.set('palerts',a);renderWatch()};
  document.querySelectorAll('[data-ra]').forEach(b=>b.onclick=()=>{const a=store.get('palerts',[]);a.splice(+b.dataset.ra,1);store.set('palerts',a);renderWatch()});
}
function checkAlerts(){
  const al=store.get('palerts',[]);let ch=false;
  al.forEach(a=>{if(a.done)return;const r=screenData.find(x=>x.ticker===a.t);if(!r)return;if((a.dir==='above'&&r.price>=a.px)||(a.dir==='below'&&r.price<=a.px)){a.done=true;a.when=new Date().toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});ch=true;const m=`${a.t} is ${a.dir} $${fmt(a.px,2)} (now $${fmt(r.price,2)})`;toast(m);if(window.Notification&&Notification.permission==='granted')new Notification('Marketscope alert',{body:m})}});
  if(ch){store.set('palerts',al);if(cur==='watch')renderWatch()}
}
/* ---------- HELP ASSISTANT (works offline from the page; answers from live data on the site) ---------- */
const hist=store.get('chat',[]);
function say(who,html){hist.push({who,html});store.set('chat',hist.slice(-40));paintChat()}
function paintChat(){const o=$('#helpOut');o.innerHTML=hist.map(m=>`<div class="msg ${m.who}">${m.html}</div>`).join('');o.scrollTop=o.scrollHeight}
const A=(label,act)=>`<a href="#" class="act" data-act="${act}">${label}</a>`;
function mq(n){return live&&live.market&&live.market.find(m=>m.name.toLowerCase()===n)}
function answer(q){
  const L=q.toLowerCase().trim();let out=[];
  /* actions */
  let m;
  if(m=L.match(/(?:set|change|move|what if).*?(?:rates?|shock).*?([+-]?\d{2,3})\s*(?:bp|bps|basis)?/)){const v=Math.max(-300,Math.min(300,Math.round(+m[1]/25)*25));shock=v;store.set('shock',v);go('sim');return `Set the simulator to <b>${v>0?'+':''}${v} bp</b> and opened it.`}
  if(m=L.match(/^(?:go to|open|show me|take me to)\s+(.*)$/)){const map={markets:'markets',market:'markets',screener:'screener',watchlist:'watch',alerts:'watch',simulator:'sim','rate simulator':'sim',rates:'sim',oil:'viz','oil flow map':'viz','flow map':'viz','how it works':'about'};const k=Object.keys(map).find(x=>m[1].includes(x));if(k){go(map[k]);return 'Opened <b>'+MODS[map[k]].t+'</b>.'}}
  /* market prices */
  const names={'s&p':'s&p 500','sp500':'s&p 500','s&p 500':'s&p 500','nasdaq':'nasdaq','dow':'dow','russell':'russell 2000','vix':'vix','dollar':'us dollar index','gold':'gold','copper':'copper','natural gas':'natural gas','wti':'wti crude','brent':'brent crude','bitcoin':'bitcoin','btc':'bitcoin','oil price':'wti crude','crude price':'wti crude'};
  Object.keys(names).filter(k=>L.includes(k)).slice(0,2).forEach(k=>{const q=mq(names[k]);if(q&&!out.some(o=>o.includes(q.name)))out.push(`<b>${q.name}</b> is ${q.price>=1000?fmt(q.price,0):fmt(q.price,2)} (${pc(q.d1)} today, ${pc(q.m1,1)} over a month).`)});
  if(/10.?(yr|year)|yield|treasury/.test(L)&&!/curve/.test(L)){const t=rate10();if(t)out.push(`The 10-year Treasury yield is <b>${fmt(t,2)}%</b>.`)}
  if(/curve|invert|spread/.test(L)&&live&&live.curve){const c=live.curve,i=l=>c.labels.indexOf(l),v=c.now.v;if(i('2 Yr')>=0&&i('10 Yr')>=0){const s=v[i('10 Yr')]-v[i('2 Yr')];out.push(`The 10-year minus 2-year spread is <b>${s>=0?'+':''}${fmt(s,2)} pts</b> (${s<0?'inverted — short rates above long rates':'normal — long rates above short rates'}). ${A('Open Markets','go:markets')}`)}}
  /* tickers */
  const tk=(q.match(/\b[A-Z]{1,5}\b/g)||[]).filter(t=>screenData.find(x=>x.ticker===t)).slice(0,2);
  tk.forEach(t=>{const r=screenData.find(x=>x.ticker===t);out.push(`<b>${r.ticker}</b> (${r.sector}): $${fmt(r.price,2)}${r.d1!=null?', '+pc(r.d1)+' today':''}; P/E ${fmt(r.pe)}, ROE ${fmt(r.roe)}%, debt/equity ${fmt(r.debt_equity,2)}, yield ${fmt(r.div_yield,2)}%, ${pc(r.mom_1y,1)} over a year. ${passes(r)?'It <b>meets</b>':'It does <b>not</b> meet'} your screener rules. ${A('Details','stock:'+t)} ${A('Watch','watch:'+t)}`)});
  /* screener */
  if(/screen|pass|match|how many|filter/.test(L)&&screenData.length){const h=screenData.filter(passes);out.push(`<b>${h.length} of ${screenData.length}</b> companies meet your rules (P/E ≤ ${crit.pe_max}, ROE ≥ ${crit.roe_min}%, debt/equity ≤ ${crit.de_max}, yield ≥ ${crit.dy_min}%). ${h.slice(0,8).map(r=>r.ticker).join(', ')}${h.length>8?'…':''} ${A('Open Screener','go:screener')}`)}
  if(/gainer|winner|best|top mover|biggest.*(up|gain)/.test(L)&&screenData.length){const s=[...screenData].filter(r=>r.d1!=null).sort((a,b)=>b.d1-a.d1).slice(0,3);if(s.length)out.push('Biggest gainers today: '+s.map(r=>`<b>${r.ticker}</b> ${pc(r.d1)}`).join(', ')+'.')}
  if(/loser|worst|biggest.*(down|drop|fall)/.test(L)&&screenData.length){const s=[...screenData].filter(r=>r.d1!=null).sort((a,b)=>a.d1-b.d1).slice(0,3);if(s.length)out.push('Biggest decliners today: '+s.map(r=>`<b>${r.ticker}</b> ${pc(r.d1)}`).join(', ')+'.')}
  /* simulator by sector */
  const sec=sectData.find(s=>L.includes(s.sector.toLowerCase())||(s.sector==='Real Estate'&&/reit/.test(L))||(s.sector==='Financial Services'&&/bank|financial/.test(L))||(s.sector==='Healthcare'&&/health/.test(L)));
  if(sec&&/rate|hike|cut|simulat|interest|hurt|affect|impact/.test(L)){const px=-sec.equity_duration*(shock/100),dI=sec.floating_share*sec.debt_ebitda*(shock/10000),c1=1/(1/sec.interest_cover+dI);out.push(`At the simulator's current <b>${shock>0?'+':''}${shock} bp</b>, <b>${sec.sector}</b> is estimated at ${pc(px,1)} (price), with interest coverage going from ${fmt(sec.interest_cover)}× to ${fmt(c1)}×. ${A('Open Simulator','go:sim')}`)}
  /* oil */
  if(/oil|crude|import|export|canada|persian|gulf|opec|venezuela|mexico/.test(L)&&flowOK()){const M=flowData.months,i=M.length-1,I=flowData.imports,tot=Object.values(I).reduce((t,a)=>t+(a[i]||0),0),top=Object.entries(I).sort((a,b)=>b[1][i]-a[1][i])[0];const key=Object.keys(I).find(k=>L.includes(k.toLowerCase()))||(L.includes('gulf')?'Persian Gulf':null);
    out.push(key?`<b>${key}</b> supplied ${fmt(I[key][i],2)} mb/d of U.S. crude imports in ${M[i]} (vs ${fmt(I[key][0],2)} in ${M[0]}).`:`In ${M[i]} the U.S. imported <b>${fmt(tot,2)} mb/d</b> of crude; the largest source was <b>${top[0]}</b> at ${fmt(top[1][i],2)} mb/d. ${A('Open Oil Flow Map','go:viz')}`)}
  /* freshness */
  if(/updat|refresh|fresh|last|next|real.?time|live|delay/.test(L)&&live){const u=new Date(live.updated);out.push(`Data was last refreshed <b>${ago(live.updated)}</b> (${u.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}). The collector runs about every 5 minutes and this page re-checks every minute. Prices are ~15 min delayed; company fundamentals refresh every 6 hours; oil flows update when the EIA publishes (about monthly).`)}
  if(out.length)return out.join('<br><br>');
  /* knowledge base: score by keyword hits */
  const sc=KB.map(([k,t,tags])=>({t,s:(L.match(new RegExp(k,'gi'))||[]).length})).filter(x=>x.s>0).sort((a,b)=>b.s-a.s).slice(0,2);
  if(sc.length)return sc.map(x=>x.t).join('<br><br>');
  const body=encodeURIComponent('Question: '+q+'\n\n(Sent from the Marketscope help box)');
  return `I couldn't find an answer to that in the site's data or guide. You can ask about live prices ("what is the S&P at?"), a ticker ("tell me about NVDA"), your screener results, the rate simulator ("what happens to utilities at +200 bp?"), oil flows, or how things work. Or <a href="https://github.com/AA-rya/marketscope/issues/new?title=${encodeURIComponent('Question: '+q.slice(0,60))}&body=${body}" target="_blank" rel="noopener">send this question to the project team</a> (opens a pre-filled GitHub issue).`;
}
const KB=[
 ['markets|index|indices|nasdaq|vix|bitcoin','The Markets tab shows live prices for major indexes, VIX (the "fear gauge"), the dollar, gold, copper, natural gas, oil and Bitcoin, plus top movers, the Treasury yield curve and headlines. Prices run about 15 minutes behind the exchanges.'],
 ['yield curve|curve|invert','The yield curve plots Treasury interest rates from short to long maturities. When short rates exceed long rates it is "inverted" — historically a sign investors expect slower growth or rate cuts.'],
 ['screener|rules|criteria','Screener: set your rules (max P/E, min ROE, max debt/equity, min dividend yield, min 1-year change). Companies meeting every rule are highlighted. Click a company for a detail page with a price chart; star it to add it to your watchlist. Tick "Alert me" to be told when a new company starts passing.'],
 ['watchlist|alert|notify|notification','Watchlist & alerts: add companies to follow, and set price alerts ("AAPL goes above $300"). When a data refresh crosses your price you get a pop-up and, if allowed, a browser notification. Everything is stored only in your browser.'],
 ['import|csv|historical|upload|export|download','Every tool has Import CSV and Download CSV. Download gives you the live data in the exact layout; edit or extend it (e.g. with history from FRED or Bloomberg) and import it back. It stays in your browser and overrides live data until you press "Switch back to live data".'],
 ['source|where.*data|come from','Sources: Yahoo Finance (prices, company fundamentals, headlines), U.S. Treasury (yield curve, average interest rates), U.S. Energy Information Administration (oil import and export tables). "How it works" has a table with how often each updates.'],
 ['rate|hike|cut|simulator|bp|basis','Rate simulator: a rate rise lifts interest costs in proportion to how much of an industry\'s debt is floating-rate and how leveraged it is, lowering interest coverage. Long-duration stocks (utilities, REITs, growth tech) fall most because far-off profits are discounted harder. 100 basis points = 1 percentage point.'],
 ['portfolio|my mix|holdings','Your portfolio (Rate Simulator): enter the % you hold in each industry; the page weights the estimated price effects by your mix.'],
 ['duration','Equity duration ≈ how sensitive a stock\'s price is to a 1-point move in rates. Estimated price effect = −duration × rate change. It is a stated assumption per industry.'],
 ['coverage|interest cover|stress','Interest coverage = operating profit ÷ interest cost. Under about 2× is stressed; 2–4× tight; above 4× comfortable.'],
 ['p/e|pe ratio|roe|debt|yield|glossary|mean|what is','P/E = price per $1 of yearly profit (lower is cheaper). ROE = profit earned on shareholder money. Debt/equity = how much of the business is borrowed. Dividend yield = yearly dividend ÷ price. More terms are in the glossary on "How it works".'],
 ['bitcoin|crypto','Bitcoin is shown on the Markets tab as a risk-appetite gauge.'],
 ['sidebar|menu|navigate|tab|where','Use the left sidebar: Markets, Screener, Watchlist, Rate Simulator and Oil Flow Map. "How it works" is at the very bottom.']];
const HELP_SUGG=['What is the S&P at?','Tell me about NVDA','How many stocks pass my screen?','What happens to utilities at +200 bp?','Where did Canada oil imports land?','When did it last refresh?','Open the watchlist'];
function helpInit(){
  if(!hist.length)hist.push({who:'bot',html:'Hi! Ask me anything about the site, the finance behind it, or the live numbers. I read the same data you see on screen.'});
  $('#helpSugg').innerHTML=HELP_SUGG.map(q=>`<span class="q">${q}</span>`).join('');
  document.querySelectorAll('#helpSugg .q').forEach(e=>e.onclick=()=>send(e.textContent));
  $('#helpBtn').onclick=()=>{$('#help').classList.add('open');$('#helpQ').focus();paintChat()};$('#helpX').onclick=()=>$('#help').classList.remove('open');
  $('#helpGo').onclick=()=>send($('#helpQ').value);$('#helpQ').onkeydown=e=>{if(e.key==='Enter')send($('#helpQ').value)};
  $('#helpClr').onclick=()=>{hist.length=0;hist.push({who:'bot',html:'Chat cleared. What would you like to know?'});store.set('chat',[]);paintChat()};
  $('#helpOut').addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;e.preventDefault();const [k,v]=a.dataset.act.split(':');if(k==='go'){go(v);$('#help').classList.remove('open')}if(k==='stock'){openStock(v);$('#help').classList.remove('open')}if(k==='watch'){toggleWatch(v)}});
  paintChat();
}
function send(q){q=(q||'').trim();if(!q)return;$('#helpQ').value='';say('me',q.replace(/</g,'&lt;'));let a;try{a=answer(q)}catch(e){a='Something went wrong answering that — try rephrasing.'}setTimeout(()=>say('bot',a),250)}

/* ---------- boot ---------- */
helpInit();drawTabs();MODS[cur].r();loadLive();pullRates();
setInterval(loadLive,60*1000);setInterval(setStatus,30*1000);

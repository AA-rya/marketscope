<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marketscope — FMKT 256</title>
<style>
:root{--bg:#f6ece4;--panel:#fffaf7;--ink:#3a2a2c;--mute:#8a7273;--line:#ecdcd3;--acc:#c4607a;--acc2:#a07a5c;--up:#4f8a6a;--dn:#c0455a;--shadow:0 1px 2px rgba(120,70,70,.05),0 8px 24px rgba(160,100,100,.09);--font:"Inter","SF Pro Display",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;--sans:"Inter",system-ui,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
header{display:flex;align-items:center;gap:14px;padding:16px 32px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
.logo{width:34px;height:34px;border-radius:10px;background:var(--acc);display:grid;place-items:center;color:var(--panel)}
.logo svg{width:20px;height:20px}
h1{font:700 20px var(--font);margin:0;letter-spacing:-.3px}h1 small{display:block;font:500 11px var(--sans);color:var(--mute);letter-spacing:.3px;margin-top:1px}
.spacer{flex:1}select,input,button,textarea{font:inherit;color:var(--ink)}
select,input[type=text],input[type=number]{background:var(--panel);border:1px solid var(--line);padding:8px 11px;border-radius:10px;outline:none;transition:border-color .15s,box-shadow .15s}
select:focus,input:focus{border-color:var(--acc);box-shadow:0 0 0 3px color-mix(in srgb,var(--acc) 15%,transparent)}
button{background:var(--panel);border:1px solid var(--line);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:500;transition:all .15s}button:hover{border-color:var(--acc);transform:translateY(-1px)}
button.pri{background:var(--acc);color:var(--panel);border-color:var(--acc)}
nav{display:flex;gap:6px;padding:16px 32px 0;align-items:center}
nav .tab{padding:9px 18px;border-radius:999px;cursor:grab;font-weight:600;font-size:14px;color:var(--mute);user-select:none;transition:all .15s;background:transparent}
nav .tab:hover{color:var(--ink)}nav .tab.on{background:var(--acc);color:var(--panel)}nav .tab.over{outline:2px dashed var(--acc2)}
main{padding:30px 36px 70px;max-width:1200px;margin:0 auto}
.row{display:flex;gap:22px;flex-wrap:wrap;align-items:flex-start}.col{flex:1;min-width:300px}
.card{background:var(--panel);border:1px solid var(--line);padding:20px 22px;border-radius:16px;margin-bottom:20px;box-shadow:var(--shadow)}
.card h2{font:700 17px var(--font);margin:0 0 4px;letter-spacing:-.2px}.note{color:var(--mute);font-size:13px}
label{display:block;font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 4px;letter-spacing:.2px}
input[type=range]{accent-color:var(--acc2)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font:600 11px var(--sans);text-transform:uppercase;letter-spacing:.7px;color:var(--mute);text-align:right;padding:10px 10px;border-bottom:1px solid var(--line);cursor:pointer;white-space:nowrap}
th:first-child,td:first-child,th.l,td.l{text-align:left}td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:right}
td:first-child{font-weight:700}
tr.hit td{background:color-mix(in srgb,var(--acc2) 9%,transparent)}tr.hit td:first-child{box-shadow:inset 3px 0 var(--acc2)}.up{color:var(--up);font-weight:600}.dn{color:var(--dn);font-weight:600}
.pill{display:inline-block;font-size:11px;font-weight:600;border:1px solid var(--line);padding:3px 10px;border-radius:999px;color:var(--mute)}
.pill.live{color:var(--up);border-color:color-mix(in srgb,var(--up) 40%,transparent);background:color-mix(in srgb,var(--up) 8%,transparent)}.pill.warn{color:var(--dn);border-color:color-mix(in srgb,var(--dn) 40%,transparent);background:color-mix(in srgb,var(--dn) 7%,transparent)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:14px;margin-bottom:20px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px 18px;box-shadow:var(--shadow)}
.kpi b{display:block;font:700 26px var(--font);letter-spacing:-.6px;margin-top:2px}.kpi span{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}.kpi i{font-style:normal;font-size:13px;font-weight:600;color:var(--mute);display:block;margin-top:2px;letter-spacing:0}
.hero{background:var(--acc);color:var(--panel);border-radius:22px;padding:34px 36px;margin-bottom:22px;position:relative;overflow:hidden}
.hero h2{font:800 34px var(--font);letter-spacing:-1px;margin:0 0 8px;color:var(--panel)}.hero p{margin:0;max-width:560px;opacity:.85;font-size:16px}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:var(--acc2);opacity:.9}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px;margin-bottom:6px}
.grid3 .card{margin:0}.step{width:30px;height:30px;border-radius:9px;background:color-mix(in srgb,var(--acc2) 16%,transparent);color:var(--acc2);display:grid;place-items:center;font-weight:800;margin-bottom:10px}
.go{color:var(--acc2);font-weight:600;text-decoration:none;cursor:pointer}
#toast{position:fixed;right:22px;bottom:22px;display:flex;flex-direction:column;gap:8px;z-index:9}
#toast div{background:var(--ink);color:var(--panel);padding:12px 16px;border-radius:12px;max-width:340px;font-size:13px;box-shadow:var(--shadow)}
#help{position:fixed;right:0;top:0;bottom:0;width:380px;background:var(--panel);border-left:1px solid var(--line);padding:22px;transform:translateX(100%);transition:transform .25s;z-index:8;overflow:auto;box-shadow:var(--shadow)}
#help.open{transform:none}#helpOut{white-space:pre-wrap;margin-top:12px;font-size:14px}
.q{cursor:pointer;color:var(--acc2);font-weight:500;display:block;margin:6px 0;font-size:13px}
canvas,svg{max-width:100%}
.src{font-size:12px;color:var(--mute);margin-top:8px}

.app{display:flex;min-height:100vh}
#side{width:240px;flex:none;position:sticky;top:0;height:100vh;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:22px 14px;gap:4px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px 18px}
#side .tab{display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--mute);transition:all .15s}
#side .tab:hover{background:color-mix(in srgb,var(--acc) 7%,transparent);color:var(--ink)}
#side .tab.on{background:var(--acc);color:var(--panel)}
#side .tab svg{width:18px;height:18px;flex:none}
.sidesp{flex:1}.stat2{font-size:12px;line-height:1.5;padding:0 4px}.stat2 b{color:var(--ink);font-weight:600}
.sidebox{padding:10px 8px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line);margin-top:8px}
.content{flex:1;min-width:0}
@media(max-width:820px){.app{flex-direction:column}#side{width:auto;height:auto;position:static;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px}.brand{padding:0 8px 0 0}.sidesp{display:none}.sidebox{border:0;margin:0;flex-direction:row;padding:0}main{padding:16px}}

.pagehead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin:2px 0 18px}.pagehead h2{font:800 28px var(--font);letter-spacing:-.8px;margin:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:22px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow)}.tn{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.6px}
.tp{font:700 24px var(--font);letter-spacing:-.5px;margin:2px 0}.tc{font-size:13px;font-weight:600}.tm{margin-top:4px;font-size:12px}.spark{width:100%;height:30px;display:block;margin-top:6px}
.chart{width:100%;height:auto;display:block}.ax{fill:var(--mute);font:11px var(--sans)}.nl{fill:var(--ink);font:700 13px var(--sans)}.nv{fill:var(--mute);font:12px var(--sans)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mute);margin-top:6px}.legend i{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
.hb{display:grid;grid-template-columns:150px 1fr 64px;gap:10px;align-items:center;padding:6px 0;font-size:13px}.hl{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ht{position:relative;height:18px;background:color-mix(in srgb,var(--line) 55%,transparent);border-radius:9px}.hz{position:absolute;left:50%;top:-3px;bottom:-3px;width:1.5px;background:var(--mute);opacity:.5}.hf{position:absolute;top:0;bottom:0;border-radius:9px;min-width:3px}.hv{text-align:right;font-weight:600}
.hax{display:grid;grid-template-columns:150px 1fr 64px;font-size:11px;color:var(--mute);margin-top:4px}.hax span:nth-child(1){grid-column:2;justify-self:start}.hax{display:flex;justify-content:space-between;padding:0 64px 0 160px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}.chip{padding:7px 13px;border-radius:999px;font-weight:600;font-size:13px}.chip.on{background:var(--acc);border-color:var(--acc);color:#fff}
.big{font:800 44px var(--font);letter-spacing:-1.5px;margin:6px 0 2px}.big small{font:600 14px var(--sans);color:var(--mute);letter-spacing:0}.big.sm2{font-size:30px}
.rng{display:flex;justify-content:space-between;font-size:11px;color:var(--mute);margin-top:2px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}.seg button{border:0;border-radius:0;background:transparent;padding:8px 14px}.seg button.on{background:var(--acc);color:#fff}.seg button:hover{transform:none}
.howto{padding:0}.howto summary{cursor:pointer;font:700 15px var(--font);padding:14px 22px;list-style:none}.howto summary::after{content:"+";float:right;color:var(--mute)}.howto[open] summary::after{content:"–"}.howto ol{margin:0;padding:0 22px 16px 42px;color:var(--ink)}.howto li{margin:6px 0}
.headline{background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:12px;padding:12px 16px;margin:10px 0 14px;font-size:14px}
.tw{overflow-x:auto}.tw table{font-size:13px}.tw td,.tw th{padding-left:7px;padding-right:7px}.pill.amber{color:#9a6a1c;border-color:#e3c48d;background:#fbf1de}.chk{display:flex;gap:8px;align-items:center;margin-top:14px;font-weight:500;color:var(--ink)}.chk input{width:auto}.inl{display:inline;margin:0 4px 0 0}
.src-tbl td,.src-tbl th{text-align:left;font-size:13px;vertical-align:top}.pfr{display:grid;grid-template-columns:1fr 70px;gap:8px;align-items:center;margin:6px 0}.pfr label{margin:0}.pfo{margin-top:12px;padding-top:10px;border-top:1px solid var(--line)}
.kpi b.sm{font-size:19px;letter-spacing:-.3px;line-height:1.2}.kpi i{display:block}h3{font:700 14px var(--font);margin:6px 0 4px}
@media(max-width:560px){.hb{grid-template-columns:96px 1fr 56px}.hax{padding-left:106px}.big{font-size:36px}}
</style>
</head>
<body>
<div class="app">
<aside id="side">
  <div class="brand"><div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l5-6 4 4 8-10"/><path d="M15 5h5v5"/></svg></div><h1>Marketscope<small>FMKT 256</small></h1></div>
  <div id="tabs"></div>
  <div class="sidesp"></div>
  <div class="sidebox"><span id="status" class="pill">connecting to data…</span><div id="stat2" class="note stat2"></div><button id="helpBtn">Help / Ask</button></div>
  <div id="tabsBottom" style="margin-top:6px"></div>
</aside>
<div class="content"><main id="view"></main></div>
</div>
<div id="toast"></div>
<aside id="help">
  <div style="display:flex;justify-content:space-between"><b style="font-family:var(--font);font-size:18px">Help</b><button id="helpX">Close</button></div>
  <p class="note">Ask anything about using the tools or the finance behind them. Runs in your browser — no login or API key.</p>
  <input id="helpQ" type="text" placeholder="e.g. how does a rate hike hit utilities?" style="width:100%">
  <div class="tools"><button class="pri" id="helpGo">Ask</button></div>
  <div id="helpSugg"></div><div id="helpOut"></div>
</aside>

<script>
/* ---------- state & helpers ---------- */
const $=s=>document.querySelector(s);
const fmt=(n,d=1)=>Number(n).toLocaleString(undefined,{minimumFractionDigits:d,maximumFractionDigits:d});
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function toast(m){const d=document.createElement('div');d.textContent=m;$('#toast').appendChild(d);setTimeout(()=>d.remove(),6000)}
function parseCSV(t){const L=t.trim().split(/\r?\n/).map(l=>l.split(',').map(x=>x.trim()));const h=L.shift();return L.map(r=>Object.fromEntries(h.map((k,i)=>[k,isNaN(r[i])||r[i]===''?r[i]:+r[i]])))}
function toCSV(rows){const h=Object.keys(rows[0]);return [h.join(','),...rows.map(r=>h.map(k=>r[k]).join(','))].join('\n')}
function dl(name,text){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/csv'}));a.download=name;a.click()}
function importBox(onData){const i=document.createElement('input');i.type='file';i.accept='.csv';i.onchange=()=>i.files[0].text().then(t=>{try{onData(parseCSV(t));toast('Imported '+i.files[0].name)}catch(e){toast('Could not parse CSV')}});i.click()}


/* ---------- live data ---------- */
let live=null, screenData=store.get('screen',null)||[], sectData=store.get('sect',null)||[], flowData=store.get('flow',null);
const isImp=k=>!!store.get(k,null);
const tag=k=>isImp(k)?'<span class="pill">your imported file</span>':(live?'<span class="pill live">live data</span>':'<span class="pill">loading…</span>');
let rates=store.get('rates',null);
async function pullRates(){
  const u='https://api.fiscaldata.treasury.gov/services/api/fiscal_service/v2/accounting/od/avg_interest_rates?filter=security_desc:in:(Treasury%20Bills,Treasury%20Notes,Treasury%20Bonds)&sort=-record_date&page[size]=60';
  try{const r=await fetch(u);const j=await r.json();rates=j.data.map(d=>({date:d.record_date,security:d.security_desc,rate:+d.avg_interest_rate_amt}));store.set('rates',rates);return true}catch(e){return false}
}
function ago(iso){const s=(Date.now()-new Date(iso))/1000;if(s<90)return 'just now';if(s<3600)return Math.round(s/60)+' min ago';if(s<86400)return Math.round(s/3600)+' h ago';return Math.round(s/86400)+' d ago'}
function setStatus(){const s=$('#status'),t=$('#stat2');if(!live){s.textContent='connecting…';s.className='pill';t.innerHTML='';return}
  const u=new Date(live.updated),mins=(Date.now()-u)/60000,old=mins>45,nx=new Date(+u+5*60000),tm=d=>d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  s.textContent=(old?'Delayed · ':'Live · ')+'updated '+ago(live.updated);s.className='pill '+(old?'warn':'live');
  const left=(nx-Date.now())/60000;
  t.innerHTML=`Last refresh: <b>${tm(u)}</b><br>Next refresh: <b>${left>0.5?'about '+tm(nx):'due now'}</b>${left>0.5?' (in '+Math.ceil(left)+' min)':''}<br>Refreshes every 5 min`}
async function loadLive(){
  try{const r=await fetch('data.json?'+Date.now(),{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();if(!j.updated)throw 0;
    const first=!live;live=j;
    if(!isImp('screen')&&j.screen)screenData=j.screen;if(!isImp('sect')&&j.sect)sectData=j.sect;if(!isImp('flow'))flowData=j.flow||null;
    setStatus();if(first||true)redraw();
  }catch(e){setStatus()}
}
function redraw(){
  if(cur==='markets'&&$('#mk'))drawMarkets();
  else if(cur==='screener'&&$('#tbl')){drawTbl(true);$('#srcpill').innerHTML=tag('screen')}
  else if(cur==='sim'&&$('#bars'))drawSim();
  else if(cur==='viz'&&$('#viz')){drawViz();drawOil()}
  else if(cur==='markets'||cur==='screener'||cur==='sim'||cur==='viz'){MODS[cur].r()}
}
const rate10=()=>{const a=live&&live.rates&&live.rates.DGS10;return a&&a.length?a[a.length-1][1]:null};
const empty=(what)=>`<div class="card"><h2>Waiting for live data</h2><p class="note">${what} will appear as soon as the data feed answers. If this message stays, refresh the page — or import your own CSV on this tab.</p></div>`;

/* ---------- small chart helpers ---------- */
function spark(a,up){const lo=Math.min(...a),hi=Math.max(...a),w=100,h=28,p=a.map((v,i)=>[i/(a.length-1)*w,h-2-(v-lo)/((hi-lo)||1)*(h-4)]);
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" class="spark"><polyline points="${p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" fill="none" stroke="var(${up?'--up':'--dn'})" stroke-width="1.8" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`}
const pc=(v,d=2)=>`<span class="${v>=0?'up':'dn'}">${v>=0?'+':''}${fmt(v,d)}%</span>`;

/* ---------- tabs ---------- */
const MODS={about:{t:'How it works',r:renderAbout},markets:{t:'Markets',r:renderMarkets},screener:{t:'Screener',r:renderScreener},sim:{t:'Rate Simulator',r:renderSim},viz:{t:'Oil Flow Map',r:renderViz}};
const order=['markets','screener','sim','viz'];let cur=store.get('cur4','markets');if(!MODS[cur])cur='markets';
const ICO={markets:'<path d="M3 17l5-6 4 4 8-10"/><path d="M15 5h5v5"/>',screener:'<path d="M3 5h18M6 12h12M10 19h4"/>',sim:'<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>',viz:'<path d="M3 6c6 0 6 12 12 12h6M3 18c6 0 6-12 12-12h6"/>',about:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'};
function go(k){cur=k;store.set('cur4',k);drawTabs();MODS[k].r();scrollTo(0,0)}
function tabEl(k){const d=document.createElement('div');d.className='tab'+(k===cur?' on':'');d.innerHTML='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICO[k]+'</svg>'+MODS[k].t;d.onclick=()=>go(k);return d}
function drawTabs(){const n=$('#tabs'),m=$('#tabsBottom');n.innerHTML='';m.innerHTML='';order.forEach(k=>n.appendChild(tabEl(k)));m.appendChild(tabEl('about'))}

/* ---------- HOW IT WORKS ---------- */
function renderAbout(){
  const l=k=>`<a href="#" data-go="${k}" class="go">${MODS[k].t} &rarr;</a>`;
  $('#view').innerHTML=`<div>
  <div class="hero"><h2>See the market<br>before it moves.</h2><p>Marketscope puts four things in one place: what markets are doing right now, which stocks fit your rules, what a change in interest rates could do to each industry, and where the oil the U.S. relies on is actually coming from.</p></div>
  <div class="grid3">
  <div class="card"><div class="step">1</div><h2>${l('markets')}</h2><p>Today's snapshot: stock indexes, the dollar, gold, oil, Bitcoin and the Treasury yield curve. Each tile shows the price, today's move and a one-month trend line.</p><p><b>How to use it:</b> glance at it first. If the yield curve line sits well above where it was a month ago, borrowing costs just rose — that is what the Rate Simulator tests.</p></div>
  <div class="card"><div class="step">2</div><h2>${l('screener')}</h2><p>You decide what a "good" stock means — not too expensive, solid profits, little debt — and it highlights every company that fits.</p><p><b>How to use it:</b> change the boxes on the left. Use the search and industry menu to narrow the list, click any column title to sort, and tick <i>Alert me</i> to get a pop-up the moment a new company starts passing.</p></div>
  <div class="card"><div class="step">3</div><h2>${l('sim')}</h2><p>Pretend the Federal Reserve moves rates and see which industries are hurt or helped, and whether companies could still afford their interest bills.</p><p><b>How to use it:</b> drag the slider or tap a preset (+50 means rates rise half a percentage point). Longer bars to the left = bigger estimated loss. Then type your own mix of industries into <i>Your portfolio</i> to see the effect on you.</p></div>
  <div class="card"><div class="step">4</div><h2>${l('viz')}</h2><p>A picture of U.S. crude oil: which countries send it in, and which regions it's shipped out to. Thicker band = more barrels.</p><p><b>How to use it:</b> pick two months with the menus, then flip between <i>Before</i>, <i>After</i> and <i>Change</i> to see who gained or lost market share. The headline above the chart is written automatically from the numbers.</p></div>
  </div><div style="height:20px"></div>
  <div class="card"><h2>Where the numbers come from</h2><p class="note">Everything below is real, public data. Nothing on the site is made up or hand-typed.</p>
  <table class="src-tbl"><tr><th class="l">What</th><th class="l">Source</th><th class="l">How often it updates</th></tr>
  <tr><td class="l">Index, commodity, currency, crypto prices; stock prices</td><td class="l">Yahoo Finance</td><td class="l">Pulled every 5 minutes (prices run roughly 15 minutes behind the exchanges)</td></tr>
  <tr><td class="l">Treasury yield curve</td><td class="l">U.S. Treasury daily par yield curve (falls back to Yahoo yields)</td><td class="l">Every 5 minutes; Treasury itself publishes once per business day</td></tr>
  <tr><td class="l">Company profits, debt, dividends</td><td class="l">Company filings via Yahoo Finance</td><td class="l">Every 6 hours (they only change when companies report)</td></tr>
  <tr><td class="l">Oil flows (imports by country, exports by region)</td><td class="l">U.S. Energy Information Administration (EIA)</td><td class="l">Checked every 5 minutes; EIA publishes new months about once a month</td></tr>

  <div class="card"><div class="tools" style="margin-top:0"><label class="inl">Before</label><select id="fa">${M.map(m=>`<option ${m===fA?'selected':''}>${m}</option>`).join('')}</select><label class="inl">After</label><select id="fb">${M.map(m=>`<option ${m===fB?'selected':''}>${m}</option>`).join('')}</select><span class="seg"><button data-v="A">Before</button><button data-v="B">After</button><button data-v="D">Change</button></span><span style="flex:1"></span>${tag('flow')}<button id="imp">Import CSV</button><button id="exp">Download CSV</button><button id="rst">Switch back to live data</button></div>
  <div id="headline" class="headline"></div><div id="viz"></div><div class="note" style="margin-top:8px">${flowData.source||'Imported data'}. Units: million barrels per day (mb/d). EIA reports monthly and publishes with a lag of about two months. A blank value from the source is shown as zero.</div></div>
  <div class="card"><h2>Oil prices, last 6 months</h2><div class="note" id="oilnote"></div><canvas id="oil" width="900" height="260"></canvas></div>`;
  $('#fa').onchange=e=>{fA=e.target.value;drawViz()};$('#fb').onchange=e=>{fB=e.target.value;drawViz()};
  document.querySelectorAll('[data-v]').forEach(b=>b.onclick=()=>{fView=b.dataset.v;drawViz()});
  $('#imp').onclick=impFlow;$('#exp').onclick=()=>{const rows=[];['imports','exports'].forEach(st=>Object.entries(flowData[st]).forEach(([k,v])=>flowData.months.forEach((m,i)=>rows.push({stage:st==='imports'?'import':'export',region:k,month:m,mbd:v[i]}))));dl('oil_flows.csv',toCSV(rows))};
  $('#rst').onclick=()=>{try{localStorage.removeItem('flow')}catch(e){}flowData=(live&&live.flow)||null;renderViz();toast('Using live data')};
  drawViz();drawOil();
}
function impFlow(){importBox(rows=>{const months=[...new Set(rows.map(r=>r.month))],f={months,imports:{},exports:{},source:'Imported file'};
  rows.forEach(r=>{const st=/^imp/i.test(r.stage)?'imports':'exports';(f[st][r.region]=f[st][r.region]||months.map(()=>0))[months.indexOf(r.month)]=+r.mbd});flowData=f;store.set('flow',f);renderViz()})}
function drawViz(){
  if(!$('#viz')||!flowOK())return;const M=flowData.months,ia=M.indexOf(fA),ib=M.indexOf(fB);document.querySelectorAll('[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===fView));
  const I=flowData.imports,E=flowData.exports,val=(o,k,i)=>(o[k]||[])[i]||0,sum=(o,i)=>Object.keys(o).reduce((t,k)=>t+val(o,k,i),0);
  /* headline */
  const names=[...new Set([...Object.keys(I)])],ch=names.map(k=>({k,a:val(I,k,ia),b:val(I,k,ib)})).map(x=>({...x,d:x.b-x.a})).sort((x,y)=>Math.abs(y.d)-Math.abs(x.d));
  const ta=sum(I,ia),tb=sum(I,ib),big=ch[0];
  $('#headline').innerHTML=ia===ib?'Pick two different months to compare.':`Total crude imports went from <b>${fmt(ta,2)}</b> to <b>${fmt(tb,2)} mb/d</b> (${pc((tb/ta-1)*100,1)}) between ${fA} and ${fB}. The biggest mover was <b>${big.k}</b>: ${fmt(big.a,2)} → ${fmt(big.b,2)} mb/d${big.a>0?' ('+pc((big.b/big.a-1)*100,0)+')':''}. Exports went from <b>${fmt(sum(E,ia),2)}</b> to <b>${fmt(sum(E,ib),2)} mb/d</b>.`;
  if(fView==='D'){
    const side=(o,title)=>{const rows=Object.keys(o).map(k=>({k,d:val(o,k,ib)-val(o,k,ia),a:val(o,k,ia),b:val(o,k,ib)})).sort((x,y)=>x.d-y.d),mx=Math.max(.05,...rows.map(r=>Math.abs(r.d)))*1.1;
      return `<div class="col"><h3>${title}</h3>${rows.map(r=>`<div class="hb"><div class="hl">${r.k}</div><div class="ht"><div class="hz"></div><div class="hf" style="${r.d>=0?'left:50%':'right:50%'};width:${Math.abs(r.d)/mx*50}%;background:var(--${r.d>=0?'up':'dn'})"></div></div><div class="hv">${Math.abs(r.d)<.005?'0.00':(r.d>=0?'+':'')+fmt(r.d,2)}</div></div>`).join('')}</div>`};
    $('#viz').innerHTML=`<div class="row">${side(I,'Coming in (mb/d change)')}${side(E,'Going out (mb/d change)')}</div>`;return}
  const i=fView==='A'?ia:ib,cs=getComputedStyle(document.body),g=k=>cs.getPropertyValue(k).trim(),ink=g('--ink'),mute=g('--mute');
  const pal=[g('--acc'),g('--acc2'),'#e3a0b0','#d8b99a','#8d5a6b','#b9a08c','#c98f6a','#9c7f86'];
  const O=Object.keys(I).sort((a,b)=>val(I,b,i)-val(I,a,i)).filter(k=>val(I,k,i)>0),D=Object.keys(E).sort((a,b)=>val(E,b,i)-val(E,a,i)).filter(k=>val(E,k,i)>0);
  const imp=sum(I,i),exp=sum(E,i),gap=8,H=430,top=26,MIN=30,xl=190,xh=410,xr=640,nw=14;
  const slots=(arr,o,k)=>arr.reduce((t,n)=>t+Math.max(val(o,n,i)*k,MIN)+gap,-gap);
  let k=Math.min(H/Math.max(imp,.1),H/Math.max(exp,.1));for(let n=0;n<60&&(slots(O,I,k)>H||slots(D,E,k)>H);n++)k*=.93;
  let s='';const oy={},dy={};let y=top;O.forEach(o=>{const w=val(I,o,i)*k,sl=Math.max(w,MIN);oy[o]=[y+(sl-Math.max(w,3))/2,y+sl/2];y+=sl+gap});
  y=top;D.forEach(d=>{const w=val(E,d,i)*k,sl=Math.max(w,MIN);dy[d]=[y+(sl-Math.max(w,3))/2,y+sl/2];y+=sl+gap});
  const hubY=top;let hy=hubY;
  O.forEach((o,j)=>{const w=val(I,o,i)*k,a0=oy[o][0],b0=hy;hy+=w;const mx=(xl+nw+xh)/2,h=Math.max(w,3);
    s+=`<path d="M${xl+nw} ${a0} C ${mx} ${a0}, ${mx} ${b0}, ${xh} ${b0} L ${xh} ${b0+w} C ${mx} ${b0+w}, ${mx} ${a0+h}, ${xl+nw} ${a0+h} Z" fill="${pal[j%pal.length]}" fill-opacity=".5"><title>${o} → U.S.: ${fmt(val(I,o,i),2)} mb/d</title></path>`;
    s+=`<rect x="${xl}" y="${a0}" width="${nw}" height="${h}" rx="3" fill="${pal[j%pal.length]}"/><text x="${xl-10}" y="${oy[o][1]-2}" text-anchor="end" class="nl">${o}</text><text x="${xl-10}" y="${oy[o][1]+12}" text-anchor="end" class="nv">${fmt(val(I,o,i),2)} mb/d</text>`});
  let ey=hubY;D.forEach(d=>{const w=val(E,d,i)*k,a0=ey,b0=dy[d][0],h=Math.max(w,3);ey+=w;const mx=(xh+nw+xr)/2;
    s+=`<path d="M${xh+nw} ${a0} C ${mx} ${a0}, ${mx} ${b0}, ${xr} ${b0} L ${xr} ${b0+h} C ${mx} ${b0+h}, ${mx} ${a0+w}, ${xh+nw} ${a0+w} Z" fill="${ink}" fill-opacity=".16"><title>U.S. → ${d}: ${fmt(val(E,d,i),2)} mb/d</title></path>`;
    s+=`<rect x="${xr}" y="${b0}" width="${nw}" height="${h}" rx="3" fill="${ink}" fill-opacity=".7"/><text x="${xr+nw+10}" y="${dy[d][1]-2}" class="nl">${d}</text><text x="${xr+nw+10}" y="${dy[d][1]+12}" class="nv">${fmt(val(E,d,i),2)} mb/d</text>`});
  s+=`<rect x="${xh}" y="${hubY}" width="${nw}" height="${imp*k}" rx="4" fill="${ink}" fill-opacity=".85"/><text x="${xh+nw/2}" y="${hubY-8}" text-anchor="middle" class="nl">United States</text>`;
  s+=`<text x="${xh+nw/2}" y="${hubY+imp*k+18}" text-anchor="middle" class="nv">${fmt(imp,2)} in · ${fmt(exp,2)} out</text>`;
  $('#viz').innerHTML=`<svg id="sv" viewBox="0 0 ${xr+230} ${Math.max(H,imp*k+30)+top+30}" class="chart">${s}</svg><div class="note" style="text-align:center">Showing ${fView==='A'?fA:fB}. What goes in but not out (${fmt(imp-exp,2)} mb/d) is refined or stored in the U.S.</div>`;
}
function drawOil(){
  const c=$('#oil');if(!c)return;const x=c.getContext('2d'),cs=getComputedStyle(document.body),g=k=>cs.getPropertyValue(k).trim();x.clearRect(0,0,c.width,c.height);
  const o=live&&live.oil;if(!o||(!o.wti&&!o.brent)){$('#oilnote').textContent='Appears once the live feed answers.';return}
  const S=[['WTI',o.wti,g('--acc')],['Brent',o.brent,g('--acc2')]].filter(s=>s[1]&&s[1].length);const all=S.flatMap(s=>s[1].map(p=>p[1])),lo=Math.min(...all)-3,hi=Math.max(...all)+3,L=50,R=c.width-20,T=30,B=c.height-26;
  x.font='12px '+g('--sans');x.strokeStyle=g('--line');x.fillStyle=g('--mute');x.lineWidth=1;
  for(let i=0;i<=4;i++){const y=T+(B-T)*i/4,v=hi-(hi-lo)*i/4;x.beginPath();x.moveTo(L,y);x.lineTo(R,y);x.stroke();x.textAlign='right';x.fillText('$'+v.toFixed(0),L-8,y+4)}
  S.forEach(([n,d,col],k)=>{x.strokeStyle=col;x.lineWidth=2.4;x.beginPath();d.forEach((p,i)=>{const px=L+(R-L)*i/(d.length-1),py=B-(B-T)*(p[1]-lo)/(hi-lo);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.fillStyle=col;x.textAlign='left';x.fillText(n+' $'+d[d.length-1][1].toFixed(2),L+10+k*140,14)});
  const d0=S[0][1];x.fillStyle=g('--mute');x.textAlign='left';x.fillText(d0[0][0],L,B+16);x.textAlign='right';x.fillText(d0[d0.length-1][0],R,B+16);
  $('#oilnote').textContent='Daily front-month futures, USD per barrel (Yahoo Finance).';
}

/* ---------- help ---------- */
const KB=[
 ['markets|index|indices|s&p|nasdaq|vix|dollar|gold|bitcoin','Markets tab: live prices for the major indexes, VIX (the "fear gauge"), the dollar, gold, copper, natural gas, oil and Bitcoin, each with today\'s move and a one-month trend line. Prices run about 15 minutes behind the exchanges.'],
 ['yield curve|curve|invert|2s10s|spread','The yield curve plots Treasury interest rates from short to long maturities. When short rates exceed long rates it is "inverted", historically a sign investors expect slower growth or rate cuts. The chart compares now, a month ago and a year ago.'],
 ['screener|filter|flag|criteria|rules','Screener: set your rules (max P/E, min ROE, max debt/equity, min dividend yield, min 1-year change). Companies meeting every rule are highlighted. Search by ticker, filter by industry, and click a column title to sort. Tick "Alert me" to get a notification when a new company starts passing after a refresh.'],
 ['import|csv|historical|upload','Every tool has Import CSV and Download CSV buttons. Download gives you the live data in the exact layout; edit or extend it (e.g. with history from FRED or Bloomberg) and import it back. Imports live only in your browser and override live data until you press "Switch back to live data".'],
 ['real.?time|live|update|refresh|delay|fresh','Updating: a program on GitHub collects Yahoo Finance, U.S. Treasury and EIA data every 5 minutes and saves it to this site; your browser checks for new data every minute and redraws. Stock prices are ~15 minutes delayed; company fundamentals refresh every 6 hours; oil flows update when EIA publishes (about monthly).'],
 ['source|where.*data|from where','Sources: Yahoo Finance (prices, company fundamentals), U.S. Treasury (yield curve, average interest rates), U.S. Energy Information Administration (oil import and export tables). The "How it works" page has a table with update frequency for each.'],
 ['rate|hike|cut|interest|simulator|bp|basis','Simulator: a rate rise lifts interest costs in proportion to how much of an industry\'s debt is floating-rate and how leveraged it is, lowering coverage; long-duration stocks (utilities, REITs, growth tech) fall most because far-off profits are discounted harder. 100 basis points = 1 percentage point.'],
 ['portfolio|my mix|holdings','Your portfolio (Rate Simulator): enter the % you hold in each industry; the page weights the estimated price effects by your mix and shows the total for the chosen rate move.'],
 ['utilit|reit|real estate','Utilities and REITs behave like bonds: heavy debt, long duration, high payouts. They usually fall most when rates rise and gain most when rates fall.'],
 ['duration','Equity duration ≈ how sensitive a stock\'s price is to a 1-point move in rates. Estimated price effect = −duration × rate change. It is an assumption per industry, not a measured value.'],
 ['coverage|interest cover|stress','Interest coverage = operating profit ÷ interest cost. Under about 2× is stressed; 2–4× tight; above 4× comfortable. The simulator recomputes it after the rate move.'],
 ['oil|flow|map|crude|import|export|gulf|canada|persian','Oil Flow Map: U.S. crude oil imports by origin (left) and exports by destination region (right), from the EIA, in million barrels per day. Choose a before and after month, then switch between Before, After and Change. The headline above the chart is generated from the numbers.'],
 ['sidebar|menu|navigate|tab|where','Use the left sidebar: Markets, Screener, Rate Simulator and Oil Flow Map. "How it works" is at the very bottom.'],
 ['p/e|pe ratio|roe|debt|yield|glossary|mean','P/E = price per $1 of yearly profit (lower is cheaper). ROE = profit earned on shareholder money. Debt/equity = how much of the business is borrowed. Dividend yield = yearly dividend ÷ price. More terms are in the glossary on "How it works".']];
function ask(q){const m=KB.filter(([k])=>new RegExp(k,'i').test(q));return m.length?m.slice(0,3).map(x=>x[1]).join('\n\n'):'I can answer questions about the four tools, CSV import, how and when data updates, and the finance concepts behind them. Try: "how often does it update?", "what is the yield curve?", "why do utilities fall when rates rise?"'}
$('#helpBtn').onclick=()=>$('#help').classList.add('open');$('#helpX').onclick=()=>$('#help').classList.remove('open');
$('#helpGo').onclick=()=>$('#helpOut').textContent=ask($('#helpQ').value);$('#helpQ').onkeydown=e=>{if(e.key==='Enter')$('#helpGo').click()};
$('#helpSugg').innerHTML=['How often does it update?','Where does the data come from?','What is the yield curve?','Why do utilities fall when rates rise?','How do I import data?'].map(q=>`<span class="q">${q}</span>`).join('');
document.querySelectorAll('.q').forEach(e=>e.onclick=()=>{$('#helpQ').value=e.textContent;$('#helpGo').click()});

drawTabs();MODS[cur].r();loadLive();pullRates();
